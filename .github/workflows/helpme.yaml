name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# TODO#0 (DONE): workflow-scoped permissions — least privilege.
# Everything starts read-only, then we grant only the write scopes a scanner
# actually needs. Scoping per-workflow (instead of repo-wide) means a compromised
# action in THIS workflow cannot push code, publish packages, or touch other repos.
# Docs: https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions:
  contents: read            # checkout the source
  security-events: write    # TODO#0a: upload SARIF to the Security tab
  issues: write             # TODO#0b: Gitleaks/Sonar can open/comment on issues
  pull-requests: write      # TODO#0b: comment findings on PRs
  id-token: write           # TODO#0c: OIDC token (keyless auth to cloud/registry)
  actions: read             # read workflow metadata/artifacts (CodeQL needs this on PRs)

jobs:
    # GATE#0: Secret scanning (TruffleHog + Gitleaks)
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
              # this step checks out the code so scanners can analyze it.
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#1 (DONE): 0 = full history.
                # A secret deleted in a later commit still lives in every earlier
                # commit object. The default shallow clone (fetch-depth: 1) only has
                # the tip, so the scanner would never see the leak — and TruffleHog
                # needs both ends of base..HEAD to diff.
                fetch-depth: 0

              # TruffleHog scans code + commit history for verified secrets (live creds). It can be noisy, but is a great first line of defense.
            - name: Run TruffleHog
              uses: trufflesecurity/trufflehog@main
              continue-on-error: true # NOTE THAT THIS IS NOT A BEST PRACTICE — ideally we would fail here and fix secrets before moving on to later gates, but for demo purposes we want to see results from all scanners.
              with:
                path: ./
                # TODO#2 (DONE): scan the commit diff base..HEAD instead of the whole repo each run
                base: ${{ github.event.repository.default_branch }}
                head: HEAD
                # TODO#3 (DONE): --only-verified → report only creds TruffleHog could
                # authenticate against the live provider (huge noise reduction)
                extra_args: --only-verified

            # Gitleaks scans code + history for regex patterns that look like secrets. It can be more accurate than TruffleHog, but may miss live creds that don't match known patterns.
            # TODO#4 (DONE)
            # Q: TruffleHog verifies live creds → very few false positives, but misses
            #    secrets for providers it has no verifier for (and revoked-but-still-leaked ones).
            #    Gitleaks is pure regex → catches far more (incl. custom/unknown formats),
            #    but produces many more false positives (test fixtures, sample keys, UUIDs).
            #    => Gitleaks: more false positives. TruffleHog: more false negatives.
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              continue-on-error: true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
                GITLEAKS_ENABLE_SUMMARY: true

    # GATE#1a: SAST via SonarQube
    sast-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning # this line means "you need to finish the secret-scanning job before starting this one (sast-scan)"
        if: ${{ !cancelled() }}
        # the above line means "only run this job if the workflow hasn't been cancelled by a previous job (e.g. secret-scanning)"
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#5 (DONE): Sonar runs git blame to attribute issues to authors and to
                # work out what "new code" is. A shallow clone breaks both → full history.
                fetch-depth: 0

            # TODO#6 (DONE)
            # Q: findings land in the SonarQube/SonarCloud dashboard, not the GitHub
            #    Security tab, because this action does not emit SARIF — it pushes results
            #    to the Sonar server over its own API. Only SARIF uploaded through
            #    github/codeql-action/upload-sarif shows up in the Security tab.
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v7.1.0
              continue-on-error: true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # GATE#1b: SAST via CodeQL (results in GitHub Security tab)
    codeql-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }}
        strategy:
            matrix:
                # TODO#7 (DONE): React components and Next.js API routes are both JS/TS.
                # CodeQL merged the two into one extractor: 'javascript-typescript'.
                language: [ 'javascript-typescript' ]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

              # CodeQL is GitHub's native code scanning solution that uses a powerful query language to find security and quality issues. It integrates directly with the GitHub Security tab and can be customized with your own queries.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                languages: ${{ matrix.language }}
                # TODO#8 (DONE): both suites.
                #   security-extended    → default security queries + lower-precision /
                #                          higher-recall vulnerability queries (OWASP / CWE Top 25)
                #   security-and-quality → security-extended + maintainability & reliability rules
                # Using both is explicit and future-proof: you state you want the deeper
                # security set even if the quality suite's contents change, and quality
                # smells (dead code, unused vars, missing error handling) are often the
                # soil real vulns grow in.
                queries: security-extended,security-and-quality
                # RESOURCE — CodeQL query suites:
                # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages#codeql-query-suites

            # TODO#9 (DONE)
            # Q: category is the unique key GitHub uses per SARIF upload. If two matrix
            #    languages upload under the same category, the second upload is treated as
            #    a re-run of the first for the same tool+category: it REPLACES it, so the
            #    earlier language's alerts get closed/overwritten and you silently lose
            #    half your findings.
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                category: "/language:${{ matrix.language }}"

    # GATE#2: Dependency scanning via OWASP Dependency-Check (SARIF + HTML)
    dependency-scanning:
        runs-on: ubuntu-latest
        needs: [sast-scan, secret-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#10 (DONE)
            - name: Set up Node 20
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'

            # TODO#11 (DONE): without node_modules, Dependency-Check only sees the
            # top-level manifest and misses transitive dependencies.
            - name: Install dependencies
              run: npm install

              # OWASP Dependency-Check is a popular open-source tool that scans your dependencies for known vulnerabilities. It can output results in SARIF format for GitHub Security tab integration, as well as HTML for human-readable reports.
            - name: Depcheck
              uses: dependency-check/Dependency-Check_Action@main
              continue-on-error: true # NOTE THAT THIS IS NOT A BEST PRACTICE — ideally we would fail here and fix secrets before moving on to later gates, but for demo purposes we want to see results from all scanners.
              id: Depcheck # give this step an ID so we can reference its outputs in later steps (e.g. for SARIF upload)
              with:
                project: 'DontEverPushThisCodeV2'
                path: '.' # scan current directory (which should be the repo root after checkout)
                # TODO#12 (DONE): SARIF is the format GitHub's Security tab ingests.
                # (ALL would also emit SARIF plus the human-readable HTML.)
                format: 'SARIF'
                out: 'reports'
                # TODO#13 (DONE): CVSS v3.1 bands → 0.1-3.9 LOW, 4.0-6.9 MEDIUM,
                # 7.0-8.9 HIGH, 9.0-10.0 CRITICAL. So 7 is the HIGH cut-off.
                args: >
                    --failOnCVSS 7
                    --enableRetired

            # TODO#14 (DONE)
            - name: Upload Depcheck SARIF to Security tab
              if: always()
              #the above line meant to upload SARIF even if the Depcheck step fails (e.g. due to high CVSS findings), so that we can see results in Security tab and fix issues.
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                  sarif_file: reports/dependency-check-report.sarif
                  category: dependency-check

            # TODO#15 (DONE)
            - name: Upload Depcheck HTML report as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: depcheck-report
                path: reports/

    # GATE#3: Container/Image scanning via Trivy (SARIF + artifact)
    image-scanning:
        runs-on: ubuntu-latest
        needs: [dependency-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#16 (DONE): Trivy scans an image, so the image must exist locally first.
            - name: Build Docker image
              run: docker build -t my-app:latest .

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@master
              continue-on-error: true
              with:
                image-ref: 'my-app:latest'
                # TODO#17 (DONE)
                format: 'sarif'
                output: 'trivy-results.sarif'
                # TODO#18 (DONE): report MEDIUM and above — LOW/UNKNOWN is mostly noise
                # from the base image. Reporting != blocking: we report MEDIUM+ for
                # visibility but would only gate the build on HIGH/CRITICAL.
                severity: 'CRITICAL,HIGH,MEDIUM'
                # TODO#19 (DONE): false → still report CVEs with no fix yet.
                # You cannot patch them, but you need to know they exist so you can
                # mitigate another way (drop the package, network controls, WAF) and
                # track them until a fix ships.
                ignore-unfixed: false

            # TODO#20 (DONE)
            - name: Upload Trivy SARIF to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                sarif_file: 'trivy-results.sarif'
                category: trivy

            # TODO#21 (DONE)
            - name: Upload Trivy SARIF as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: trivy-report
                path: trivy-results.sarif

    # GATE#4: IaC scanning (Since there is no infrastructure cod here and it is out of scope for this class so we could skip it HELL YEAH!)
    # GATE#5: DAST (We have OWASP ZAP workshop here so we can skip this one too! YOHOOO!)
